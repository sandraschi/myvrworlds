[project]
name = "vrworlds-mcp"
version = "0.1.0"
description = "VR worlds aggregator: on-demand router over avatar, VRChat, Resonite, Overte, Blender, Unity, Godot, WorldLabs, VRoid, OSC, speech backends"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastmcp>=3.4.4,<4",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "pyright>=1.1",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
typeCheckingMode = "basic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vrworlds_mcp"]
